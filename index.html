.panel{display:none}.panel.on{display:block}

:root{--navy:#0a1f4e;--blue:#1f5fe0;--sky:#eaf1fd;--bg:#f3f6fc}

<script>
const $=s=>document.querySelector(s);let H=[],R=[],NUM=[];

$("#demo").onclick=()=>{let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647,g=()=>(rnd()+rnd()+rnd()+rnd()-2)*1.7;let t="Method,Gender,StudyHours,Score\n";for(let i=0;i<90;i++){const m="ABC"[i%3],h=+(4+g()*2.2+(m=="C"?1:0)).toFixed(1),sc=+(48+3.2*h+(m=="B"?4:m=="C"?9:0)+g()*5).toFixed(1);t+=`${m},${rnd()<.5?"Male":"Female"},${h},${sc}\n`}load(t)};
function load(t){const p=typeof t=="string"?parse(t):t;H=p[0].map((x,j)=>x.trim()||"Var"+(j+1));R=p.slice(1);NUM=H.map((_,j)=>{const v=R.map(r=>(r[j]||"").trim()).filter(x=>x);return v.length&&v.filter(x=>isFinite(x)).length/v.length>.8});build()}
const col=j=>R.map(r=>(r[j]||"").trim());
const nums=j=>col(j).filter(x=>x!==""&&isFinite(x)).map(Number);
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length,vr=a=>{const m=mean(a);return sum(a.map(x=>(x-m)**2))/(a.length-1)};
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
const skew=a=>{const m=mean(a),s=Math.sqrt(vr(a)),n=a.length;return sum(a.map(x=>((x-m)/s)**3))*n/((n-1)*(n-2))};
const f=(x,d=2)=>isFinite(x)?x.toFixed(d):"–",pf=p=>p<.001?"< .001":p.toFixed(3);
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-5.395239384953e-6];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function bc(x,a,b){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const dl=d*c;h*=dl;if(Math.abs(dl-1)<3e-12)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bc(x,a,b)/a:1-bt*bc(1-x,b,a)/b}

function build(){
 const miss=R.reduce((a,r)=>a+H.reduce((b,_,j)=>b+((r[j]||"").trim()===""?1:0),0),0);
 const dup=R.length-new Set(R.map(r=>r.join("|"))).size;
 $("#dinfo").innerHTML=`<div class="kpi" style="margin-top:16px"><div><b>${R.length}</b>rows</div><div><b>${H.length}</b>variables</div><div><b>${miss}</b>missing cells</div><div><b>${dup}</b>duplicate rows</div></div>
 <h2>Preview</h2><div class="wrap"><table><tr>${H.map((h,j)=>`<th class="${NUM[j]?"n":""}">${h}<br><small>${NUM[j]?"numeric":"category"}</small></th>`).join("")}</tr>${R.slice(0,8).map(r=>`<tr>${H.map((_,j)=>`<td class="${NUM[j]?"n":""}">${r[j]||""}</td>`).join("")}</tr>`).join("")}</table></div>
 <div class="row"><button class="btn" onclick="show('desc')">Describe the data</button><button class="btn alt" onclick="CL.dup();build()">Remove duplicates</button><button class="btn alt" onclick="CL.miss();build()">Drop rows with missing values</button><button class="btn alt" onclick="CL.fill();build()">Fill missing numbers with mean</button></div><p style="color:#5d6f89;font-size:13px">Cleaning changes the working copy only. Reload your file to restore the original.</p>`;

 $("#desc").innerHTML=`<h2>Descriptive statistics</h2><div class="wrap"><table><tr><th>Variable</th><th class="n">N</th><th class="n">Mean</th><th class="n">Median</th><th class="n">SD</th><th class="n">Min</th><th class="n">Max</th><th class="n">Skew</th></tr>${rows}</table></div>
 <div class="row"><label>Histogram of<select id="hv">${opt(nm)}</select></label></div><div id="hist"></div>`;
 $("#hv").onchange=hist;hist();

 <label id="l1">Outcome (numeric)<select id="v1">${opt(nm)}</select></label><label id="l2">Groups<select id="v2">${opt(gr)}</select></label><label id="l3" style="display:none">Factor B<select id="v3">${opt(gr)}</select></label>

 $("#tt").onchange=()=>{const t=$("#tt").value,o1={c2:gr,fq:H.map((_,j)=>j)}[t]||nm,o2={c:nm,c2:gr,a2:gr}[t]||gr;$("#v1").innerHTML=opt(o1);$("#v2").innerHTML=opt(o2);$("#v3").innerHTML=opt(gr);if((t=="c"&&nm.length>1)||(t=="c2"&&gr.length>1))$("#v2").selectedIndex=1;if(t=="a2"&&gr.length>1)$("#v3").selectedIndex=1;$("#l1").firstChild.textContent={c:"Variable X",c2:"Variable 1",fq:"Variable"}[t]||"Outcome (numeric)";$("#l2").firstChild.textContent={c:"Variable Y",c2:"Variable 2",a2:"Factor A"}[t]||"Groups";$("#l2").style.display=["nm","fq"].includes(t)?"none":"";$("#l3").style.display=t=="a2"?"":"none"};
 $("#run").onclick=run;show("data")}

function gp(a,x){if(x<=0)return 0;if(x<a+1){let s=1/a,d=s,n=a;for(let i=0;i<300;i++){n++;d*=x/n;s+=d;if(Math.abs(d)<Math.abs(s)*1e-12)break}return s*Math.exp(-x+a*Math.log(x)-lg(a))}let b=x+1-a,c=1e30,d=1/b,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-30)d=1e-30;c=b+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const dl=d*c;h*=dl;if(Math.abs(dl-1)<1e-12)break}return 1-Math.exp(-x+a*Math.log(x)-lg(a))*h}
const pC=(x,df)=>1-gp(df/2,x/2);
const tb=(hd,rows)=>`<div class="wrap"><table><tr>${hd.map((x,i)=>`<th${i?' class="n"':''}>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="n"':''}>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
const nt=(s,w)=>`<div class="note${w?" warn":""}">${s}</div>`;
const dec=(p,a)=>p<a?"statistically significant":"not statistically significant";
function an(G){const k=Object.keys(G),all=[].concat(...k.map(x=>G[x])),N=all.length,K=k.length,gm=mean(all),ssb=sum(k.map(x=>G[x].length*(mean(G[x])-gm)**2)),ssw=sum(k.map(x=>sum(G[x].map(v=>(v-mean(G[x]))**2)))),d1=K-1,d2=N-K,F=(ssb/d1)/(ssw/d2);return{k,N,K,d1,d2,F,p:pF(F,d1,d2),msw:ssw/d2}}
const CL={dup(){const s=new Set;R=R.filter(r=>{const k=r.join("|");if(s.has(k))return false;s.add(k);return true})},miss(){R=R.filter(r=>H.every((_,j)=>(r[j]||"").trim()!==""))},fill(){H.forEach((_,j)=>{if(!NUM[j])return;const m=mean(nums(j));R.forEach(r=>{if(!(r[j]||"").trim())r[j]=String(+m.toFixed(4))})})}};
const zt3=m=>{const la=Object.keys(m),lb=[...new Set(la.flatMap(x=>Object.keys(m[x])))];if(la.length<2||lb.length<2||la.some(x=>lb.some(z=>!(m[x][z]&&m[x][z].length))))return null;const ym=mean(la.flatMap(x=>Object.values(m[x]).flat())),ef=(i,n)=>Array.from({length:n-1},(_,k)=>i==n-1?-1:+(i==k)),X=[],Y=[];
